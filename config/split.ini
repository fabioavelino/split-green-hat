# split.ini - single-instance two-player settings
#
# The file lives in the emulator's config folder:
#   portable: <folder with lichii.exe>\user\config\split.ini
#   installed: %APPDATA%\eden\config\split.ini
#
# Unknown keys or invalid values turn split mode off and are logged, so a typo
# never starts a half-configured session.

enabled = 1

# vertical = left/right, horizontal = top/bottom
layout = vertical

# 1.0 to 4.0; 2.0 doubles enemy max and current HP.
enemy_hp = 2.0

# Lichii controller index for player 2. Player 1 uses controller 1.
player2_controller = 2

# first = the first player in a cutscene owns the full screen.
cutscene_mode = first

# shared = one game over and Continue restarts both Links.
game_over = shared

# Second view resolution scale, 0.5 to 1.0. 1.0 is native.
second_view_scale = 1.0
